syntax = "proto3";

package scalpel.examples.greeting.relay.v1;

service GreetingRelay {
  rpc GetGreeting(GetGreetingRequest) returns (GetGreetingResponse);
}

message GetGreetingRequest {}

message GetGreetingResponse {
  oneof result {
    Greeting greeting = 1;
    GreetingUnavailable unavailable = 2;
  }
}

message Greeting {
  string message = 1;
  string character_name = 2;
  string submitted_message = 3;
}

message GreetingUnavailable {
  GreetingUnavailableReason reason = 1;
  string message = 2;
}

enum GreetingUnavailableReason {
  GREETING_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  GREETING_UNAVAILABLE_REASON_NO_MESSAGE = 1;
  GREETING_UNAVAILABLE_REASON_CHARACTER_UNAVAILABLE = 2;
  GREETING_UNAVAILABLE_REASON_PROVIDER_ERROR = 3;
}
